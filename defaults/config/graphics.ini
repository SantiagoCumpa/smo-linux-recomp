; graphics.ini: display and rendering options of the native build (read once at start by gfx_options.c).
; Delete the file to get it written again with these defaults. A line starting with ';' is a comment.
; Every value below is the default; the defaults draw exactly what the game draws on the console.

; renderer = vulkan
;   Vulkan is the only renderer of the Linux build.
renderer = vulkan

; window = borderless_fullscreen | borderless_window | windowed | fullscreen
;   borderless_window:     a window without a frame or title bar, the size below, centred by the compositor.
;                          Double-click it for borderless_fullscreen and back.
;   borderless_fullscreen: no frame, covers the monitor the window is on (the desktop keeps its resolution).
;                          The default.
;   windowed:              a normal window with a title bar, the client size below.
;   fullscreen:            as borderless_fullscreen, and always on top. (Exclusive fullscreen with a mode change is
;                          not implemented.)
;   F11 switches between covering the monitor and the window while the game runs.
window = borderless_fullscreen
width = 1280
height = 720

; vsync = clock | on | off | mailbox      (Vulkan)
;   clock:   frames are shown at once (mailbox when the GPU offers it, else immediate) and the game is paced by the
;            program's own 60 Hz clock. Lowest latency; can tear only when mailbox is missing.
;   on:      the display's own vertical sync (FIFO). No tearing; on a display that is not 60 Hz the two clocks drift.
;   off:     immediate presentation, tearing allowed. The game still runs at 60 frames per second.
;   mailbox: mailbox or nothing (falls back to clock's choice with a message when the GPU does not offer it).
vsync = clock

; gpu = auto | <number> | <part of the name>      (Vulkan)
;   auto: a discrete GPU first, then an integrated one. The log lists the devices with their numbers:
;   'nvn_vk: device 0: ...'. Examples: gpu = 1      gpu = Intel      gpu = RTX
gpu = auto

; console_mode = docked | handheld
;   What nn::oe::GetOperationMode answers. Leave it at docked: handheld is not measured on PC.
console_mode = docked

; resolution = 720p | 900p | 1080p | 1440p | 2160p      (Vulkan)
;   The internal resolution the game draws at. 900p (1600x900) is the game's own; above it the picture is drawn with
;   more detail (more GPU work), below it softer (less). 720p = 1280x720, 1080p = 1920x1080, 1440p = 2560x1440,
;   2160p = 3840x2160. When set, it wins over resolution_scale.
resolution = 900p

; resolution_scale = 1.0
;   The same as a factor of 1600x900, 0.25 to 2.4 (Vulkan only): 0.5 = 800x450, 1.2 = 1920x1080, 2.4 = 3840x2160.
;   Used when there is no resolution line. 0.5 or 0.75 is the main switch for a weak GPU. The whole picture is drawn
;   at that size, the 2D interface too, and is scaled to the window size.
;   resolution and resolution_scale are used while the "HD resolution" mod is on (mods/, settings menu: Mods);
;   with it off the game draws at its own 900p.
resolution_scale = 1.0

; texture_filtering = game | bilinear | trilinear      (Vulkan)
;   game: each texture sampler as the game made it. bilinear: no blending between mip levels (a visible line where
;   one level meets the next, as many older games); trilinear: blended (smooth, costs little). Only samplers the game
;   made to filter linearly with mip maps change; the rest (data, lookup tables) stay as they are.
;   Used while the "Texture filtering" mod is on.
texture_filtering = game

; anisotropic_filtering = game | 2 | 4 | 8 | 16      (Vulkan)
;   game: each texture sampler keeps the value the game gave it. A number: at least that much on every sampler that
;   filters between mip levels (sharper textures at flat angles; changes the picture, costs little on any GPU).
;   Used while the "Anisotropic filtering" mod is on.
anisotropic_filtering = game

; performance_overlay = off | fps | detailed
;   A small box over the picture: fps = frames per second and milliseconds per frame (green at 55 and above, yellow
;   from 40, red below); detailed = also the internal resolution, CPU and GPU load and temperature, video memory and
;   RAM. F10 shows and hides it while the game runs; F1 opens the settings menu, where it is set too.
performance_overlay = off

; overlay_corner = top_left | top_right | bottom_left | bottom_right | top_center | bottom_center
overlay_corner = top_left

; aspect = keep | stretch
;   keep: the game's 16:9 picture keeps its shape in a window or on a monitor of another shape (an ultrawide one, a
;   16:10 one): black bars fill the rest. stretch: the picture fills the whole window, stretched.
aspect = keep

; language = system | ja | en-US | en-GB | fr | fr-CA | de | it | es | es-419 | zh-Hans | zh-Hant | ko | nl | ru
;   The game's language (read when the game starts). system: the desktop's (LANG). SMO_LANGUAGE in the environment
;   or in the game folder's smo.env wins; the settings menu (F1) changes both.
language = system

; frame_time_overlay = off | on
;   on: the average frame time of the last second in the window title ('.. fps - 16.67 ms per frame') and as a
;   'frame-time:' line in the log. For a counter in the picture itself: performance_overlay.
frame_time_overlay = off
