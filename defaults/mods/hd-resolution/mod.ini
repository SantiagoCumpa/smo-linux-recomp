; mod.ini of a default mod (runtime/core/mods.c). This one switches on a change the runtime makes itself:
; runtime/gfx/nvn_vk_draw.c rs_scale (without it the game draws at its own 900p, as on the console, docked).
name = HD resolution
description = Draws the game at another internal resolution than its own 900p: Display, Internal resolution (up to 4K).
default = on
feature = hd_resolution
